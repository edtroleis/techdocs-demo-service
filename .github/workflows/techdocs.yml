name: techdocs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -r requirements.txt
      # Diagramas PlantUML são renderizados no build (plantuml_markdown do techdocs-core)
      - run: sudo apt-get update -q && sudo apt-get install -y -q plantuml
      - name: Generate TechDocs
        run: npx -y @techdocs/cli@1.13.0 generate --no-docker --source-dir . --output-dir ./site
