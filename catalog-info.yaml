apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: demo-service
  title: Demo Service
  description: Serviço de exemplo que expõe uma API de itens (PoC TechDocs)
  tags: [python, fastapi]
  annotations:
    github.com/project-slug: edtroleis/techdocs-demo-service
    backstage.io/techdocs-ref: dir:.
  links:
    - url: https://github.com/edtroleis/techdocs-demo-service
      title: Repositório
      icon: github
spec:
  type: service
  lifecycle: experimental
  owner: platform-team
  system: demo-system
  providesApis: [demo-api]
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: demo-api
  title: Demo API
  description: API REST de itens do demo-service
spec:
  type: openapi
  lifecycle: experimental
  owner: platform-team
  system: demo-system
  definition:
    $text: ./openapi.yaml
